<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>my-music-app — Nick의 청음실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>my-music-app</h1>
      <p class="sub">Nick의 청음실 — 취향 큐레이션 · 지식노트 · AI 탐구</p>
    </div>
    <button id="theme-toggle" type="button" aria-label="테마 전환">◐</button>
  </header>

  <nav id="intent-filter" class="tabs" aria-label="컬렉션 탭"></nav>

  <section class="recommend reveal">
    <h2 id="recommend-heading"></h2>
    <div id="recommend-list" class="entry-list"></div>
  </section>

  <section class="explore-ai reveal">
    <h2>탐구 — 무엇을 알고 싶나요?</h2>
    <div id="ex-type" class="filter-row"></div>
    <div id="ex-controls" class="ex-controls"></div>
    <div id="ex-freebox" hidden>
      <textarea id="ex-free" class="ex-free" placeholder="자유롭게 질문 (형식 제약 없음)"></textarea>
    </div>
    <input id="ex-hint" class="ex-hint" placeholder="추가 조건 한 줄 (선택) — 예: JTBC, KBS 유튜브 위주" hidden>
    <div class="ex-actions">
      <button id="ex-build" type="button" hidden>쿼리 문장 만들기</button>
      <button id="ex-send" type="button" hidden>전송</button>
    </div>
    <textarea id="ex-preview" class="ex-preview" hidden></textarea>
    <p id="ex-status" class="ex-status"></p>
    <div id="ex-results" class="ex-results"></div>
  </section>

  <section class="tools reveal">
    <h2>내 컬렉션</h2>
    <div id="tag-filter" class="filter-row"></div>
    <p id="count" class="count"></p>

    <div class="actions">
      <button id="play-all" type="button">▶ 지금 목록 재생</button>
      <button id="add-toggle" type="button">+ 새 항목 추가</button>
      <button id="export-toggle" type="button">내보내기</button>
      <button id="settings-toggle" type="button">설정</button>
    </div>
    <p id="play-status" class="count"></p>

    <div id="add-form" class="add-form" hidden>
      <input id="f-title" placeholder="제목 (곡명/아티스트명)">
      <input id="f-performer" placeholder="연주자/아티스트">
      <select id="f-intent">
        <option value="taste">내 취향</option>
        <option value="explore">클래식·교양</option>
        <option value="family">아이돌·가족</option>
      </select>
      <input id="f-tags" placeholder="태그 (쉼표로 구분)">
      <textarea id="f-note" placeholder="메모"></textarea>
      <p id="f-error" class="form-error"></p>
      <button id="f-save" type="button">저장</button>
    </div>

    <textarea id="export-box" class="export-box" hidden readonly></textarea>

    <div id="settings-box" class="settings-box" hidden>
      <label for="f-apikey">Claude API 키 <span class="settings-note" style="font-weight:400">— AI 질문·추천·브리핑용</span></label>
      <input id="f-apikey" type="password" placeholder="sk-ant-...">
      <p id="apikey-status" class="apikey-status"></p>
      <div class="settings-actions">
        <button id="apikey-save" type="button">저장</button>
        <button id="apikey-delete" type="button">삭제</button>
      </div>
      <label for="f-ytkey" style="margin-top:0.5rem">YouTube Data API 키 <span class="settings-note" style="font-weight:400">— 링크 찾기·영상 검색용 (유튜브 검색 품질)</span></label>
      <input id="f-ytkey" type="password" placeholder="AIza...">
      <p id="ytkey-status" class="apikey-status"></p>
      <div class="settings-actions">
        <button id="ytkey-save" type="button">저장</button>
        <button id="ytkey-delete" type="button">삭제</button>
      </div>
      <p class="settings-note">두 키 모두 이 브라우저의 localStorage에만 저장됩니다 — git에 올라가지 않고, "내보내기"에도 포함되지 않으며, 다른 기기에서는 다시 입력해야 합니다.</p>
    </div>
  </section>

  <main id="entry-list" class="entry-list reveal"></main>

  <!-- 절전 재생 화면 (P3) — 순수 검정, 탭하면 닫힘. 플레이어 바(z 위)는 계속 보임 -->
  <div id="play-mode" class="play-mode" hidden>
    <p class="pm-hint">탭하면 밝은 화면으로</p>
    <h2 id="pm-title"></h2>
    <p id="pm-sub"></p>
  </div>

  <!-- 미니 플레이어 (P2) — YouTube IFrame이 #yt-holder를 대체 -->
  <div id="player-bar" class="player-bar" hidden>
    <div id="yt-holder"></div>
    <div class="player-row">
      <div class="player-info">
        <b id="pl-title"></b>
        <span id="pl-sub"></span>
      </div>
      <div class="player-controls">
        <button id="pl-prev" type="button" aria-label="이전 곡">⏮</button>
        <button id="pl-next" type="button" aria-label="다음 곡">⏭</button>
        <button id="pl-dark" type="button" aria-label="절전 화면">🌙</button>
        <button id="pl-close" type="button" aria-label="플레이어 닫기">✕</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
